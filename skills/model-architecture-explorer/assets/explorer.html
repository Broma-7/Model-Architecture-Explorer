<body>
<header>
 <a class="brand" href="#"><span class="brand-icon">ϟ</span><span id="brand-name">Architecture</span><small>ARCHITECTURE EXPLORER</small></a>
 <nav aria-label="页面导航"><a href="#workspace">模型架构</a><a href="#mechanism" id="mechanism-nav">核心机制</a><a href="#tensors">张量追踪</a></nav>
 <span class="repo-tag" id="repo-tag"><span class="live-dot"></span>源码驱动 · 离线可用</span>
</header>
<main>
 <section class="hero"><div><div class="eyebrow"><b>01 /</b><span id="eyebrow">SOURCE → ARCHITECTURE</span></div><h1 id="page-title">模型架构探索器</h1><div id="subtitle" class="subtitle">请使用构建脚本注入已核对的模型数据。</div></div><div class="signature"><span id="signature">CODE → MODEL</span><small>TRACE EVERY COMPUTATION</small></div></section>
 <div class="stats" id="summary-stats" aria-label="模型关键参数"></div>
 <div class="workspace" id="workspace">
  <section class="canvas">
   <div class="panel-top"><div class="panel-title">模型数据流 <small>点击模块，展开内部计算 ↗</small></div><label class="profile-control">配置<select id="profile-picker" aria-label="模型配置"></select></label></div>
   <div class="toolbar"><div class="tabs" role="tablist" id="tabs" aria-label="架构视图"></div><div class="tools"><label>缩放 <select id="zoom" aria-label="图面缩放"><option value="100">适配</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label><button id="fullscreen">⛶ 大图</button><button id="export">↓ SVG</button><button id="print">⎙ 打印 / PDF</button></div></div>
   <div class="breadcrumb"><button id="back" disabled>← 返回</button><span id="current-view"></span><select class="view-picker" id="view-picker" aria-label="全部计算图" hidden></select><span class="layer-controls" id="layer-controls"></span></div>
   <div class="view-intro" id="view-intro" hidden></div>
   <div class="module-interface" id="module-inputs" hidden></div>
   <div class="graph-wrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="模型架构交互图"></svg></div>
   <div class="module-interface module-outputs" id="module-outputs" hidden></div>
   <div class="legend" id="legend"></div><div id="graph-hint" class="graph-hint">点击模块展开内部计算 · 点击算子查看公式与源码</div>
   <div class="playbar" id="playbar" hidden><button class="play-button" id="play">▶ 演示前向</button><button class="step-button" id="next">单步 →</button><div class="timeline" id="timeline" aria-label="前向演示步骤"></div><span class="step-label" id="step-label" aria-live="polite"></span><button id="reset" aria-label="重置演示">↺</button></div><div class="step-caption" id="step-caption" hidden></div>
  </section>
  <aside class="inspector" aria-label="模块详情"><div class="inspector-header"><b>模块检查器</b><span>INSPECTOR ↗</span></div><div class="inspector-content" id="inspector-content"></div></aside>

</main>

<script>
'use strict';
const spec=JSON.parse(document.getElementById('architecture-data').textContent);
const sources=JSON.parse(document.getElementById('source-data').textContent);
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mathHTML=value=>`<span class="math-text" data-math-template="${esc(value)}" data-math-source="${esc(expand(value))}">${window.architectureMath?architectureMath.text(expand(value)):esc(expand(value))}</span>`;
function renderMath(root){
 if(window.architectureMath||typeof renderMathInElement!=='function')return;
 root.querySelectorAll('.math-text').forEach(element=>renderMathInElement(element,{
  delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],
  throwOnError:true,trust:false,maxExpand:1000,maxSize:20,
  errorCallback:(message,error)=>{element.classList.add('math-error');element.title=error.message;}
 }));
}
const palette={input:['#f0f6f7','#c4dbe0','#52828e'],encoder:['#eff7f5','#bcd8d0','#358b7b'],fusion:['#f4f7eb','#d2dfb8','#809653'],decoder:['#f5f1fa','#d8ccea','#8d72b8'],output:['#fcf2ed','#e9c9ba','#c78262'],neutral:['#f6f8f6','#dbe3d5','#7f9574'],vision:['#eff7f5','#bcd8d0','#358b7b'],language:['#f5f1fa','#d8ccea','#8d72b8'],state:['#fcf6ec','#e8d4b4','#ba9454'],action:['#fcf2ed','#e9c9ba','#c78262']};
let profile,view,selected,history=[],statusTimer,controlValues={},flowStep=-1,playing=false,flowTimer;
function calculate(expression){
 const tokens=expression.match(/[A-Za-z_][A-Za-z_0-9]*|\d+(?:\.\d+)?|[()+*/-]/g)||[];
 if(tokens.join('')!==expression.replace(/\s/g,'')||tokens.length>100)throw Error('Invalid dimension expression');
 const values={...profile.dimensions,...controlValues};let at=0;
 function atom(){const token=tokens[at++];if(token==='('){const result=sum();if(tokens[at++]!==')')throw Error('Missing parenthesis');return result;}if(token==='-')return -atom();if(token==='+')return atom();if(/^\d/.test(token||''))return Number(token);if(Object.hasOwn(values,token))return Number(values[token]);throw Error('Unknown dimension');}
 function product(){let result=atom();while(tokens[at]==='*'||tokens[at]==='/'){const op=tokens[at++],right=atom();result=op==='*'?result*right:result/right;}return result;}
 function sum(){let result=product();while(tokens[at]==='+'||tokens[at]==='-'){const op=tokens[at++],right=product();result=op==='+'?result+right:result-right;}return result;}
 const result=sum();if(at!==tokens.length||!Number.isFinite(result))throw Error('Invalid dimension result');return result;
}
function expand(value){return String(value??'').replace(/\{\{([^{}]+)\}\}/g,(match,expression)=>{try{return String(calculate(expression));}catch{return match;}});}
const color=kind=>palette[kind]||palette.neutral;
const text=(x,y,value,size=13,fill='#81939a',weight=400,width,height)=>{
 const expanded=expand(value);
 if(window.architectureMath&&architectureMath.hasMath(expanded))return architectureMath.svg(expanded,x,y,width||view.width-x-16,size,fill);
 if(/\\\(|\\\[|\$/.test(expanded)){
  const h=height||Math.max(30,size*2.8),w=width||Math.max(1,view.width-x-16);
  return `<foreignObject class="svg-math" x="${esc(x)}" y="${esc(y-size-3)}" width="${esc(w)}" height="${esc(h)}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${size}px;color:${fill};height:100%;display:flex;align-items:center;overflow:hidden">${mathHTML(value)}</div></foreignObject>`;
 }
 return `<text class="svg-text" x="${esc(x)}" y="${esc(y)}" font-size="${esc(size)}" fill="${fill}" font-weight="${weight}">${esc(expanded)}</text>`;
};
function report(message){$('status').textContent=message;$('status').hidden=false;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('status').hidden=true,2800);}
function currentModule(){return profile.modules[selected];}
function rangeFor(module){const file=sources.files?.[module.source.file];return file?.symbols[module.source.symbol]||[1,file?.lines.length||1];}
function sourceLabel(module){return module.source.file+':'+rangeFor(module)[0]+' · '+(module.source.symbol||'完整文件');}
function paramsHTML(module){return `<dl class="params">${(module.params||[]).map(([k,v])=>`<dt>${mathHTML(k)}</dt><dd>${mathHTML(v)}</dd>`).join('')}</dl>`;}
function sourceButton(module,id){return `<button class="source-button" id="${id}">${esc(module.source.file)}:${rangeFor(module)[0]}<br>${esc(module.source.symbol||'完整文件')} ↗</button>`;}
function inspect(){
 const m=currentModule();if(!m)return;
 const expands=m.expandTo&&m.expandTo!==view.id;
 const symbols={vision:'▦',language:'Aa',state:'⌁',action:'A',input:'↦',encoder:'ƒ',fusion:'⇄',decoder:'Q',output:'↗',neutral:'⊞'};
 $('inspector-content').innerHTML=`<div class="module-symbol" style="color:${color(m.kind)[2]};background:${color(m.kind)[0]};border-color:${color(m.kind)[1]}">${esc(m.symbol||symbols[m.kind]||'ƒ')}</div><div class="tag">${esc(m.tag||(m.kind||'module').toUpperCase())} / ${esc(profile.label||profile.id)}</div><h2>${esc(m.title)}</h2><div class="description">${mathHTML(m.description)}</div><button class="primary" id="inspect-expand">${expands?'展开内部计算图 →':'打开算子详情 ↗'}</button><div class="mini-label">INPUT → OUTPUT</div><div class="shape">${mathHTML(m.input)}\n↓\n${mathHTML(m.output)}</div><div class="mini-label">CONFIGURATION / INSTANCE</div>${paramsHTML(m)}<div class="mini-label">SOURCE REFERENCE</div>${sourceButton(m,'inspect-source')}<p class="inspector-hint">点击模块逐层展开；源码入口显示原始行号。</p>`;
 renderMath($('inspector-content'));
 $('inspect-expand').onclick=()=>activate(selected);$('inspect-source').onclick=()=>showSource(m);
}
function select(id){selected=id;$('graph').querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.module===id));inspect();}
function nodeLines(n,operator,fontSize,lineHeight,inset){
 if(!window.architectureMath)return (n.lines||[]).map((line,i)=>text(n.x+inset,n.y+(operator?59:47)+i*lineHeight,line,fontSize,'#687f88',400,n.width-2*inset,Math.max(lineHeight,30))).join('');
 let top=n.y+(operator?44:34),markup='';
 for(const line of n.lines||[]){
  const value=expand(line),isMath=architectureMath.hasMath(value),size=isMath?(n.mathSize||(operator?18:16)):fontSize;
  const dims=isMath?architectureMath.dimensions(value,size):null;
  markup+=text(n.x+inset,isMath?top-dims.top:top+size,line,size,'#687f88',400,n.width-2*inset);
  top+=Math.max(lineHeight,(dims?.height||size)+9);
 }
 return markup;
}
function interfaceOrigin(port){
 const rule=port.layerOrigin;
 return rule?(Number(controlValues[rule.control])===1?rule.first:rule.later):port.origin;
}
function inputMarks(moduleId){
 return (view.interface?.inputs||[]).map((port,i)=>(port.targets||[]).includes(moduleId)?String.fromCodePoint(0x2460+i):'').join('');
}
function locateInterfaceModules(ids){
 if(!ids?.length)return;
 select(ids[0]);
 $('graph').querySelectorAll('.node').forEach(node=>node.classList.toggle('input-focus',ids.includes(node.dataset.module)));
 $('graph').scrollIntoView({block:'nearest',behavior:'smooth'});
 report('已标出对应的图内位置');
}
function returnToOrigin(origin){
 if(!origin?.view)return;
 const layerValue=origin.value==null?null:Number(expand(origin.value));
 if(origin.layer){
  const control=(profile.layerControls||[]).find(c=>c.id===origin.layer);
  if(!control||!Number.isInteger(layerValue)||layerValue<1||layerValue>control.max){report('来源层号超出范围');return;}
 }
 navigate(origin.view);
 if(origin.layer&&layerValue!=null){controlValues[origin.layer]=layerValue;renderContext();draw();}
 if(origin.module)select(origin.module);
 $('workspace').scrollIntoView({block:'start',behavior:'smooth'});
}
function renderInterface(){
 const data=view.interface,entry=$('module-inputs'),exit=$('module-outputs');
 entry.hidden=exit.hidden=!data;
 if(!data){entry.innerHTML='';exit.innerHTML='';return;}
 entry.innerHTML=`<div class="interface-heading"><strong>当前展开：${esc(expand(data.module||view.label))}</strong><span>输入来源 → 图内同号入口</span></div><div class="input-grid">${data.inputs.map((port,i)=>{
  const origin=interfaceOrigin(port),mark=String.fromCodePoint(0x2460+i);
  return `<article class="input-card"><div class="input-name"><b>${mark}</b>${mathHTML(port.label)}</div><div class="input-origin">${origin?.view?`<button data-origin="${i}">← ${esc(expand(origin.label))}</button>`:esc(expand(origin?.label||'模块外输入'))}</div><div class="input-shape">${mathHTML(port.shape)}</div><button class="input-locate" data-input="${i}">接入 ${esc(port.targets.map(id=>expand(view.nodes.find(n=>n.module===id)?.title||profile.modules[id].title)).join('、'))} →</button></article>`;
 }).join('')}</div>${data.local?`<div class="interface-local">模块内生成：${mathHTML(data.local)}</div>`:''}`;
 exit.innerHTML=`<div class="interface-heading"><strong>本模块输出</strong></div><div class="output-grid">${(data.outputs||[]).map((port,i)=>`<div class="output-card"><button data-output="${i}">${esc(expand(port.label))}</button><span class="input-shape">${mathHTML(port.shape)}</span><span>→ ${mathHTML(port.to)}</span></div>`).join('')}</div>`;
 renderMath(entry);renderMath(exit);
 entry.querySelectorAll('[data-input]').forEach(button=>button.onclick=()=>locateInterfaceModules(data.inputs[Number(button.dataset.input)].targets));
 entry.querySelectorAll('[data-origin]').forEach(button=>button.onclick=()=>returnToOrigin(interfaceOrigin(data.inputs[Number(button.dataset.origin)])));
 exit.querySelectorAll('[data-output]').forEach(button=>button.onclick=()=>locateInterfaceModules(data.outputs[Number(button.dataset.output)].sources));
}

function draw(){
 const svg=$('graph');svg.setAttribute('viewBox',`0 0 ${view.width} ${view.height}`);svg.style.aspectRatio=`${view.width}/${view.height}`;svg.style.width=$('zoom').value+'%';svg.style.minWidth=(view.minWidth||(view.variant==='operator'?Math.round(view.width*.85):650))+'px';
 const defs='<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9aafb3" stroke-width="1.2"/></marker></defs>';
 const groups=(view.groups||[]).map(g=>`<rect x="${esc(g.x)}" y="${esc(g.y)}" width="${esc(g.width)}" height="${esc(g.height)}" rx="14" fill="#fafbf8" stroke="#dce5d1" stroke-dasharray="6 5"/>${text(g.x+17,g.y+25,g.label||'',11,'#91a181')}`).join('');
 const edges=(view.edges||[]).filter(e=>(!e.firstLayerOnly||Number(controlValues[e.firstLayerOnly])===1)&&(!e.lastLayerOnly||Number(controlValues[e.lastLayerOnly])===(profile.layerControls||[]).find(c=>c.id===e.lastLayerOnly)?.max)).map(e=>`<path d="${esc(e.d)}" class="wire" stroke="${color(e.kind)[2]}" ${e.arrow===false?'':'marker-end="url(#arrow)"'}/>${e.label?text(e.labelX,e.labelY,e.label,11):''}`).join('');
 const nodes=view.nodes.map(n=>{
  const m=profile.modules[n.module],p=color(n.kind||m.kind),expands=m.expandTo&&m.expandTo!==view.id;
  const operator=view.variant==='operator',titleSize=n.titleSize||(operator?16:13),fontSize=n.fontSize||(operator?13:11),lineHeight=n.lineHeight||(operator?26:20),inset=operator?18:14;
  const blocks=(n.blocks||[]).map((block,i)=>{const y=n.y+44+i*53,c=color(block.kind||m.kind);return `<rect x="${n.x+15}" y="${y}" width="${n.width-30}" height="44" rx="7" fill="white" stroke="${p[1]}"/>${text(n.x+28,y+18,block.title,11,c[2],550)}${text(n.x+28,y+34,block.text||'',9,'#92a092')}`;}).join('');
  return `<g class="node ${selected===n.module?'selected':''}" data-node="${esc(n.id)}" data-module="${esc(n.module)}" role="button" tabindex="0" aria-label="${esc(m.title+' · '+(expands?'点击展开内部计算':'点击打开算子详情'))}"><title>${esc(m.title+' · '+(expands?'点击展开内部计算':'点击打开算子详情'))}</title><rect class="box" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="10" fill="${p[0]}" stroke="${p[1]}" stroke-width="1.2"/><rect x="${n.x+13}" y="${n.y+17}" width="5" height="5" rx="1" fill="${p[2]}"/>${text(n.x+26,n.y+(operator?29:23),(inputMarks(n.module)?inputMarks(n.module)+' ':'')+(n.title||m.title),titleSize,p[2],600,n.width-(n.badge?76:40))}${n.badge?`<rect x="${n.x+n.width-44}" y="${n.y+10}" width="32" height="20" rx="5" fill="${p[1]}"/>${text(n.x+n.width-38,n.y+24,n.badge,10,p[2],550)}`:''}${blocks||nodeLines(n,operator,fontSize,lineHeight,inset)}${n.foot?text(n.x+14,n.y+n.height-13,n.foot,10,'#536c75',400,n.width-28,24):''}</g>`;
 }).join('');
 const notes=(view.notes||[]).map(n=>text(n.x,n.y,n.text,n.size||12,'#81939a',400,n.width,n.height)).join('');svg.innerHTML=defs+groups+edges+nodes+notes;renderMath(svg);
 svg.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>activate(n.dataset.module));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(n.dataset.module);}});});
 const ancestry=viewAncestry(view);
 $('tabs').querySelectorAll('button').forEach(b=>{const active=b.dataset.view===ancestry[0].id;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});
 $('current-view').dataset.view=view.id;
 $('current-view').innerHTML=ancestry.map((v,i)=>i===ancestry.length-1?`<span aria-current="page">${esc(v.label||v.id)}</span>`:`<a href="#workspace" data-ancestor="${esc(v.id)}">${esc(v.label||v.id)}</a>`).join(' / ');
 $('current-view').querySelectorAll('[data-ancestor]').forEach(link=>link.onclick=e=>{e.preventDefault();navigate(link.dataset.ancestor);});
 $('view-picker').value=view.id;$('back').disabled=!history.length;
 $('view-intro').hidden=!view.heading&&!view.description;
 $('view-intro').innerHTML=`${view.heading?`<h2>${mathHTML(view.heading)}</h2>`:''}${view.description?`<p>${mathHTML(view.description)}</p>`:''}`;renderMath($('view-intro'));
 renderLayers();drawLegend();paintFlow();renderInterface();
}
function viewAncestry(current){const chain=[current];while(chain[0].parent)chain.unshift(profile.views.find(v=>v.id===chain[0].parent));return chain;}
function navigate(id,push=true){const next=profile.views.find(v=>v.id===id);if(!next)return;pauseFlow();flowStep=-1;if(push&&view&&view.id!==id)history.push(view.id);view=next;selected=view.defaultModule||view.nodes[0].module;draw();inspect();renderTimeline();}
function activate(id){pauseFlow();const m=profile.modules[id];select(id);if(m.expandTo&&m.expandTo!==view.id){navigate(m.expandTo);$('workspace').scrollIntoView({block:'start',behavior:'smooth'});report('已展开内部计算图，点击算子继续查看详情');}else showOperator(m);}
function showOperator(m){
 $('operator-title').textContent=m.title+' · 计算详情';
 $('operator-content').innerHTML=`<div class="tag">${esc(profile.label||profile.id)}</div><div class="operator-description">${mathHTML(m.description)}</div><div class="shapes"><div><div class="mini-label">输入 INPUT</div><div class="shape">${mathHTML(m.input)}</div></div><div><div class="mini-label">输出 OUTPUT</div><div class="shape">${mathHTML(m.output)}</div></div></div>${m.operations?.length?`<div class="mini-label">计算步骤</div><ol class="operations">${m.operations.map(s=>`<li>${mathHTML(s)}</li>`).join('')}</ol>`:''}<div class="mini-label">配置 / 层实例</div>${paramsHTML(m)}<div class="mini-label">对应源码</div>${sourceButton(m,'operator-source')}`;
 renderMath($('operator-content'));
 $('operator-source').onclick=()=>{$('operator-modal').close();showSource(m);};$('operator-modal').showModal();
}
function showSource(m){
 const file=sources.files?.[m.source.file];if(!file){report('未找到源码快照，请重新构建页面');return;}const range=rangeFor(m);
 $('source-title').textContent=sourceLabel(m);$('source-meta').textContent='工作区源码快照 · 原始行号 · 浅绿区域为对应定义';
 $('source-code').innerHTML=file.lines.map((line,i)=>`<span class="code-line ${i+1>=range[0]&&i+1<=range[1]?'focus':''}" data-line="${i+1}"><span class="line-number">${i+1}</span><span class="code-text">${esc(line)||' '}</span></span>`).join('');$('source-modal').showModal();
 requestAnimationFrame(()=>{const first=$('source-code').querySelector('.focus');if(first)$('source-code').scrollTop=Math.max(0,first.offsetTop-$('source-code').offsetTop-40);});
}
function setProfile(id){
 pauseFlow();profile=spec.profiles.find(p=>p.id===id)||spec.profiles[0];history=[];
 controlValues=Object.fromEntries([...(profile.controls||[]),...(profile.layerControls||[])].map(control=>[control.id,control.value]));
 $('profile-picker').value=profile.id;
 ['operator-modal','source-modal'].forEach(id=>{if($(id).open)$(id).close();});
 $('tabs').innerHTML=profile.views.filter(v=>!v.parent).map(v=>`<button role="tab" data-view="${esc(v.id)}" aria-selected="false">${esc(v.label||v.id)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach((button,i,buttons)=>{button.onclick=()=>navigate(button.dataset.view);button.addEventListener('keydown',e=>{let index;if(e.key==='ArrowRight')index=(i+1)%buttons.length;else if(e.key==='ArrowLeft')index=(i+buttons.length-1)%buttons.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=buttons.length-1;else return;e.preventDefault();buttons[index].click();buttons[index].focus();});});
 $('view-picker').innerHTML=profile.views.map(v=>`<option value="${esc(v.id)}">${esc(viewAncestry(v).map(a=>a.label||a.id).join(' / '))}</option>`).join('');
 $('view-picker').hidden=!profile.views.some(v=>v.parent);$('view-picker').onchange=()=>navigate($('view-picker').value);
 renderControls();renderContext();navigate(profile.defaultView||profile.views[0].id,false);
}
function drawLegend(){
 const names={vision:'视觉流',language:'语言流',state:'状态流',action:'动作流',input:'输入',encoder:'编码',fusion:'交互 / 融合',decoder:'解码',output:'输出',neutral:'特征变换'};
 const items=profile.legend||[...new Set(view.nodes.map(n=>profile.modules[n.module].kind||'neutral'))].map(kind=>({kind,label:names[kind]||kind}));
 $('legend').innerHTML=items.map(item=>`<span><i style="background:${color(item.kind)[2]}"></i>${esc(item.label)}</span>`).join('');
}
function renderContext(){
 $('subtitle').innerHTML=mathHTML(spec.subtitle||'从整体数据流到算子计算，沿源码展开每一步。');renderMath($('subtitle'));
 const overview=profile.views.find(v=>v.id===(profile.defaultView||profile.views[0].id));
 const stats=profile.stats||[];$('summary-stats').hidden=!stats.length;
 $('summary-stats').style.setProperty('--stat-count',stats.length);
 $('summary-stats').innerHTML=stats.map(stat=>`<div class="stat"><div class="stat-label">${esc(stat.label)}</div><strong>${mathHTML(stat.value)}</strong>${stat.detail?`<small>${mathHTML(stat.detail)}</small>`:''}</div>`).join('');renderMath($('summary-stats'));
 const mechanism=profile.mechanism,notes=profile.notes||[];
 $('mechanism').hidden=!mechanism&&!notes.length;$('mechanism-nav').hidden=$('mechanism').hidden;
 $('mechanism').classList.toggle('single',!mechanism||!notes.length);
 $('core-idea').hidden=!mechanism;$('implementation-notes').hidden=!notes.length;
 if(mechanism){$('core-idea').innerHTML=`<div class="section-heading"><h2>${esc(mechanism.title)}</h2><span>THE CORE IDEA</span></div>${mechanism.equations?.length?`<div class="equation">${mechanism.equations.map(e=>`<div>${mathHTML(e)}</div>`).join('')}</div>`:''}<div class="explain">${mathHTML(mechanism.description||'')}</div>${mechanism.module?`<button class="inline-action" id="mechanism-open">展开对应计算图 →</button>`:''}`;renderMath($('core-idea'));if(mechanism.module)$('mechanism-open').onclick=()=>openModule(mechanism.module);}
 if(notes.length){$('implementation-notes').innerHTML=`<div class="section-heading"><h2>读代码时的关键点</h2><span>IMPLEMENTATION NOTES</span></div><div class="implementation-notes">${notes.map((note,i)=>`<div class="implementation-note"><span class="note-number">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(note.title)}</h3><p>${mathHTML(note.text)}</p>${note.module?`<button class="inline-action" data-note-module="${esc(note.module)}">查看对应模块 ↗</button>`:''}</div></div>`).join('')}</div>`;renderMath($('implementation-notes'));$('implementation-notes').querySelectorAll('[data-note-module]').forEach(button=>button.onclick=()=>openModule(button.dataset.noteModule));}
 $('tensor-caption').textContent=(profile.label||profile.id)+' 配置 · '+(profile.tensorCaption||'沿前向路径查看输入输出与源码');
 const trace=profile.trace||[...new Set(overview.nodes.map(n=>n.module))];
 $('tensor-body').innerHTML=trace.map((id,index)=>{const m=profile.modules[id];return `<tr><td>${esc(m.title)}</td><td>${mathHTML(m.input)}</td><td>${mathHTML(m.output)}</td><td><button data-trace-index="${index}">${esc(m.source.file.split('/').pop())}:${rangeFor(m)[0]} ↗</button></td></tr>`;}).join('');
 $('tensor-body').querySelectorAll('[data-trace-index]').forEach(button=>button.onclick=()=>showSource(profile.modules[trace[Number(button.dataset.traceIndex)]]));renderMath($('tensor-body'));
 $('assumptions').innerHTML=mathHTML(profile.assumptions||'形状由配置推导，未执行模型推理。');renderMath($('assumptions'));
}
function renderLayers(){
 const controls=(profile.layerControls||[]).filter(c=>!c.views||c.views.includes(view.id));
 $('layer-controls').innerHTML=controls.map((c,i)=>`<label>${esc(c.label||c.id)}<select data-layer-index="${i}" aria-label="${esc(c.label||c.id)}">${Array.from({length:c.max},(_,j)=>`<option value="${j+1}">${j+1} / ${c.max}</option>`).join('')}</select></label>`).join('');
 $('layer-controls').querySelectorAll('select').forEach((picker,i)=>{const c=controls[i];picker.value=controlValues[c.id];picker.onchange=()=>{pauseFlow();flowStep=-1;controlValues[c.id]=Number(picker.value);renderContext();draw();inspect();renderTimeline();};});
}
function renderControls(){
 $('tensor-controls').innerHTML=(profile.controls||[]).map((control,index)=>`<label>${esc(control.label||control.id)}<input data-control-index="${index}" aria-label="${esc(control.label||control.id)}" type="number" value="${control.value}" min="${control.min??1}" max="${control.max??4096}" step="${control.step??1}"></label>`).join('');
 $('tensor-controls').querySelectorAll('input').forEach(input=>input.onchange=()=>{
  const control=profile.controls[Number(input.dataset.controlIndex)],value=Number(input.value);
  if(!input.value||!Number.isFinite(value)||!input.checkValidity()){input.value=controlValues[control.id];report('请输入范围内的有效数值');return;}
  controlValues[control.id]=value;renderContext();draw();inspect();
 });
}
function openModule(id){const target=profile.views.find(v=>v.nodes.some(n=>n.module===id));if(!target)return;navigate(target.id);activate(id);}
function pauseFlow(){clearTimeout(flowTimer);playing=false;if($('play'))$('play').textContent='▶ 演示前向';}
function paintFlow(){
 const flow=view.flow||[],modules=flow[flowStep]?.modules||[];
 $('graph').querySelectorAll('.node').forEach(node=>node.classList.toggle('running',modules.includes(node.dataset.module)));
 $('timeline').querySelectorAll('button').forEach((button,i)=>{button.classList.toggle('done',i<=flowStep);button.setAttribute('aria-current',String(i===flowStep));});
 $('step-label').textContent=(flowStep<0?'READY':String(flowStep+1).padStart(2,'0'))+' / '+String(flow.length).padStart(2,'0');
 $('step-caption').textContent=flowStep<0?'演示仅表示数据依赖，不代表运行耗时。':expand(flow[flowStep]?.label||'');
}
function goToStep(index){const flow=view.flow||[];if(!flow.length)return;flowStep=index;if(flow[index].modules.length)select(flow[index].modules[0]);paintFlow();}
function renderTimeline(){
 const flow=view.flow||[];$('playbar').hidden=!flow.length;$('step-caption').hidden=!flow.length;
 $('timeline').innerHTML=flow.map((step,i)=>`<button aria-label="${esc('步骤 '+(i+1)+'：'+step.label)}" data-step="${i}"></button>`).join('');
 $('timeline').querySelectorAll('button').forEach(button=>button.onclick=()=>{pauseFlow();goToStep(Number(button.dataset.step));});paintFlow();
}
function playFlow(){
 if(playing){pauseFlow();return;}const flow=view.flow||[];if(!flow.length)return;
 if(flowStep>=flow.length-1)flowStep=-1;
 playing=true;$('play').textContent='Ⅱ 暂停演示';
 function tick(){if(!playing)return;goToStep(flowStep+1);if(flowStep>=flow.length-1){pauseFlow();return;}flowTimer=setTimeout(tick,1600);}tick();
}
function exportSVG(){
 const svg=$('graph').cloneNode(true);svg.setAttribute('width',String(view.width));svg.setAttribute('height',String(view.height));svg.removeAttribute('style');
 const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=($('katex-styles')?.textContent||'')+'.wire{fill:none;stroke-width:1.5}.svg-text{font-family:Arial,"Microsoft YaHei",sans-serif}.node.selected .box{stroke:#587044;stroke-width:2}.math-text .katex{font-size:1.12em}.svg-math .katex-display{margin:0}.svg-math .katex{white-space:nowrap}';svg.prepend(style);
 const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('width',String(view.width));bg.setAttribute('height',String(view.height));bg.setAttribute('fill','#fff');svg.insertBefore(bg,svg.children[1]);
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`architecture-${profile.id}-${view.id}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);report('已导出当前计算图 SVG');
}
function backdrop(dialog){dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});}
if(spec.profiles?.length){
 const presentation=spec.presentation||{};
 document.title=spec.title;$('page-title').textContent=presentation.headline||spec.title;$('brand-name').textContent=presentation.brand||spec.title.split('·')[0].trim();$('eyebrow').textContent=presentation.eyebrow||'SOURCE → ARCHITECTURE';$('signature').textContent=presentation.signature||'CODE → MODEL';
 if(presentation.repository)$('repo-tag').textContent=presentation.repository;
 $('revision').textContent='CODE → ARCHITECTURE · '+spec.revision;
 $('profile-picker').innerHTML=spec.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.label||p.id)}</option>`).join('');
 const initial=spec.defaultProfile||spec.profiles[0].id;$('profile-picker').value=initial;setProfile(initial);$('profile-picker').onchange=()=>setProfile($('profile-picker').value);
 $('back').onclick=()=>{const id=history.pop();if(id)navigate(id,false);};$('zoom').onchange=()=>draw();$('export').onclick=exportSVG;$('print').onclick=()=>window.print();
 $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('workspace').requestFullscreen)await $('workspace').requestFullscreen();else report('当前浏览器不支持全屏，可使用缩放控件');}catch{report('浏览器未允许全屏，可使用缩放控件');}};
 $('close-operator').onclick=()=>$('operator-modal').close();$('close-source').onclick=()=>$('source-modal').close();backdrop($('operator-modal'));backdrop($('source-modal'));
 $('play').onclick=playFlow;$('next').onclick=()=>{pauseFlow();goToStep((flowStep+1)%(view.flow||[]).length);};$('reset').onclick=()=>{pauseFlow();flowStep=-1;paintFlow();};
}
</script>
</body>
</html>
