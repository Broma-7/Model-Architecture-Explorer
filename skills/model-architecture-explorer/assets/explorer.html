<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型架构探索器</title>
<style>
:root{--bg:#f5f7f8;--ink:#203038;--muted:#7d8d93;--line:#e2e9eb;--accent:#bddb74}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 12px}button:hover{background:#eff5e7}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #a1c65a;outline-offset:3px}header,main,footer{max-width:1660px;margin:auto;padding:28px 4%}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:30px;line-height:1.25;letter-spacing:-1px;margin:5px 0 10px}h2{font-size:18px;line-height:1.5;margin:6px 0 12px}p{margin:0 0 14px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8b9b81}.subtitle,.hint{color:var(--muted);font-size:12px}.profile-control{white-space:nowrap;font-size:12px;color:#6f8188}select{background:white;border:1px solid var(--line);padding:6px 9px;border-radius:6px}main{padding-top:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.canvas,.inspector{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button{border:0;color:#85939b;font-size:12px;padding:5px 9px;border-bottom:2px solid transparent;border-radius:0}.tabs button.active{color:#284638;border-bottom-color:#a9c761}.tools{display:flex;gap:7px;align-items:center;font-size:11px}.tools button{font-size:11px}.tools select{font-size:11px;padding:4px 5px}.breadcrumb{display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:11px;color:#93a0a4}.breadcrumb button{font-size:11px;padding:3px 9px}.graph-wrap{overflow:auto;margin:0 12px;border-radius:8px;background-image:radial-gradient(#d4dfe3 .7px,transparent .7px);background-size:18px 18px}#graph{display:block;width:100%;min-width:640px;height:auto;max-width:none}.node{cursor:pointer}.node .box{transition:filter .15s,stroke .15s}.node:hover .box,.node:focus-visible .box{filter:drop-shadow(0 3px 4px #183c3020);stroke-width:2}.node.selected .box{stroke:#587044;stroke-width:2}.wire{fill:none;stroke-width:1.5}.svg-text{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;pointer-events:none}.graph-hint{font-size:11px;color:#889b87;text-align:center;padding:12px 10px 16px}.inspector{position:sticky;top:18px}.inspector-header{border-bottom:1px solid var(--line);padding:14px 19px;font-size:11px;color:#92a0a6}.inspector-content{padding:20px}.tag{font-size:10px;letter-spacing:1px;color:#8b9e8b}.description{font-size:12px;color:#75878e;line-height:1.9}.mini-label{font-size:10px;letter-spacing:1px;color:#94a0a5;margin:16px 0 6px}.shape{background:#f4f7f8;border:1px solid #e8edef;border-radius:7px;padding:11px;font:11px/1.8 ui-monospace,monospace;overflow-wrap:anywhere;color:#4d6a72;white-space:pre-wrap}.params{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:12px}.params dt{color:#8b9aa1}.params dd{margin:0;text-align:right;color:#4d6b70;overflow-wrap:anywhere}.primary{width:100%;padding:9px 12px;background:#f0f6e4;border-color:#d5e2ba;color:#5e783c;font-size:12px}.source-button{display:block;width:100%;text-align:left;font:11px/1.8 ui-monospace,monospace;color:#587a71;overflow-wrap:anywhere}.assumptions{margin-top:18px;background:#fff;border:1px solid var(--line);padding:15px 20px;border-radius:10px;font-size:12px;color:#87969d}footer{padding-top:0;font-size:10px;color:#96a1a7;display:flex;justify-content:space-between;gap:15px}dialog{width:min(800px,94vw);max-height:86vh;padding:0;border:1px solid var(--line);border-radius:15px;box-shadow:0 25px 100px #132d3230;color:var(--ink)}dialog::backdrop{background:#14272e70;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:14px;margin:0;overflow-wrap:anywhere}.dialog-head button{padding:3px 9px}.dialog-body{padding:22px}.operator-description{color:#6a7f87;line-height:1.9;font-size:14px}.shapes{display:grid;grid-template-columns:1fr 1fr;gap:16px}.operations{padding-left:24px;color:#58756c;font:12px/2 ui-monospace,monospace}#source-modal{width:min(1000px,94vw)}#source-meta{font:11px ui-monospace,monospace;color:#899c92;padding:12px 22px}#source-code{padding:15px 0;margin:0;background:#f5f8f6;max-height:65vh;overflow:auto;font:11px/1.8 ui-monospace,monospace;tab-size:4}.code-line{display:flex;min-width:max-content;padding-right:24px}.code-line.focus{background:#e8f0d8}.line-number{display:inline-block;min-width:60px;text-align:right;padding-right:18px;color:#a1afa5;user-select:none}.code-text{white-space:pre}.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#254035;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;z-index:20}.status[hidden]{display:none}#workspace:fullscreen{padding:18px;background:var(--bg);overflow:auto;width:100%;height:100%}@media(max-width:1000px){header,main,footer{padding-left:20px;padding-right:20px}.workspace{grid-template-columns:minmax(0,1fr) 255px}.inspector-content{padding:17px}}@media(max-width:780px){header{align-items:start;flex-direction:column;gap:10px}h1{font-size:25px}.workspace{grid-template-columns:1fr}.inspector{position:static}.shapes{grid-template-columns:1fr;gap:0}.toolbar{padding:13px}.tools{flex-wrap:wrap}.graph-hint{font-size:10px}footer{flex-direction:column;gap:5px}}@media print{header .profile-control,.tools,.breadcrumb,.inspector,footer,.status{display:none}header,main{padding:10px}.workspace{display:block}.canvas,.assumptions{border-color:#d8e2db}.graph-wrap{overflow:visible}#graph{min-width:0!important;width:100%!important}body{background:white}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.workspace>*{min-width:0}.shapes>div{min-width:0}.math-text{overflow-wrap:anywhere}.math-text .katex{font-size:1.12em;line-height:1.4;white-space:normal}.math-text .katex-display{margin:.7em 0;padding:4px 2px;overflow-x:auto;overflow-y:hidden;text-align:left}.math-text .katex-display>.katex{white-space:nowrap;text-align:left}.shape .math-text{white-space:normal}.shape{overflow-x:auto}.operations{font-family:inherit;font-size:14px;line-height:1.9}.operations li{padding:4px 0}.math-error,.katex-error{color:#b42318;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<!-- KATEX_STYLES -->
</head>
<body>
<header><div><div class="eyebrow">SOURCE → ARCHITECTURE</div><h1 id="page-title">模型架构探索器</h1><p id="subtitle" class="subtitle">请使用构建脚本注入已核对的模型数据。</p></div><label class="profile-control">配置 <select id="profile-picker" aria-label="模型配置"></select></label></header>
<main><div class="workspace" id="workspace"><section class="canvas"><div class="toolbar"><div class="tabs" role="tablist" id="tabs" aria-label="架构视图"></div><div class="tools"><label>缩放 <select id="zoom" aria-label="图面缩放"><option value="100">适配</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label><button id="fullscreen">⛶ 全屏</button><button id="export">↓ SVG</button><button id="print">打印 / PDF</button></div></div><div class="breadcrumb"><button id="back" disabled>← 返回</button><span id="current-view"></span></div><div class="graph-wrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="模型架构交互图"></svg></div><div id="graph-hint" class="graph-hint">点击模块展开内部计算；点击算子打开详情。</div></section><aside class="inspector"><div class="inspector-header">模块检查器 / INSPECTOR</div><div class="inspector-content" id="inspector-content"></div></aside></div><div class="assumptions" id="assumptions"></div></main>
<footer><span>源码快照随页面离线保存 · 图形与形状依据配置推导</span><span id="revision"></span></footer>
<dialog id="operator-modal" aria-labelledby="operator-title"><div class="dialog-head"><h2 id="operator-title"></h2><button id="close-operator" aria-label="关闭算子详情">✕</button></div><div class="dialog-body" id="operator-content"></div></dialog>
<dialog id="source-modal" aria-labelledby="source-title"><div class="dialog-head"><h2 id="source-title"></h2><button id="close-source" aria-label="关闭源码">✕</button></div><div id="source-meta"></div><pre id="source-code"></pre></dialog>
<div class="status" id="status" role="status" hidden></div>
<noscript><p style="padding:24px">交互计算图需要 JavaScript。请使用允许 JavaScript 的浏览器打开本文件；IDE 的静态预览可能禁用脚本。</p></noscript>
<script id="architecture-data" type="application/json">{}</script>
<script id="source-data" type="application/json">{}</script>
<!-- KATEX_SCRIPTS -->
<script>
'use strict';
const spec=JSON.parse(document.getElementById('architecture-data').textContent);
const sources=JSON.parse(document.getElementById('source-data').textContent);
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mathHTML=value=>`<span class="math-text" data-math-source="${esc(value)}">${esc(value)}</span>`;
function renderMath(root){
 if(typeof renderMathInElement!=='function')return;
 root.querySelectorAll('.math-text').forEach(element=>renderMathInElement(element,{
  delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],
  throwOnError:true,trust:false,maxExpand:1000,maxSize:20,
  errorCallback:(message,error)=>{element.classList.add('math-error');element.title=error.message;}
 }));
}
const palette={input:['#f0f6f7','#c4dbe0','#52828e'],encoder:['#eff7f5','#bcd8d0','#358b7b'],fusion:['#f4f7eb','#d2dfb8','#809653'],decoder:['#f5f1fa','#d8ccea','#8d72b8'],output:['#fcf2ed','#e9c9ba','#c78262'],neutral:['#f6f8f6','#dbe3d5','#7f9574'],vision:['#eff7f5','#bcd8d0','#358b7b'],language:['#f5f1fa','#d8ccea','#8d72b8'],state:['#fcf6ec','#e8d4b4','#ba9454'],action:['#fcf2ed','#e9c9ba','#c78262']};
let profile,view,selected,history=[],statusTimer;
const color=kind=>palette[kind]||palette.neutral;
const text=(x,y,value,size=13,fill='#81939a',weight=400)=>`<text class="svg-text" x="${esc(x)}" y="${esc(y)}" font-size="${esc(size)}" fill="${fill}" font-weight="${weight}">${esc(value)}</text>`;
function report(message){$('status').textContent=message;$('status').hidden=false;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('status').hidden=true,2800);}
function currentModule(){return profile.modules[selected];}
function rangeFor(module){const file=sources.files?.[module.source.file];return file?.symbols[module.source.symbol]||[1,file?.lines.length||1];}
function sourceLabel(module){return module.source.file+':'+rangeFor(module)[0]+' · '+(module.source.symbol||'完整文件');}
function paramsHTML(module){return `<dl class="params">${(module.params||[]).map(([k,v])=>`<dt>${mathHTML(k)}</dt><dd>${mathHTML(v)}</dd>`).join('')}</dl>`;}
function sourceButton(module,id){return `<button class="source-button" id="${id}">${esc(sourceLabel(module))} ↗</button>`;}
function inspect(){
 const m=currentModule();if(!m)return;
 const expands=m.expandTo&&m.expandTo!==view.id;
 $('inspector-content').innerHTML=`<div class="tag">${esc(profile.label||profile.id)}</div><h2>${esc(m.title)}</h2><div class="description">${mathHTML(m.description)}</div><button class="primary" id="inspect-expand">${expands?'展开内部计算图 →':'打开算子详情 ↗'}</button><div class="mini-label">输入 → 输出</div><div class="shape">${mathHTML(m.input)}\n↓\n${mathHTML(m.output)}</div><div class="mini-label">配置 / 实例</div>${paramsHTML(m)}<div class="mini-label">对应源码</div>${sourceButton(m,'inspect-source')}`;
 renderMath($('inspector-content'));
 $('inspect-expand').onclick=()=>activate(selected);$('inspect-source').onclick=()=>showSource(m);
}
function select(id){selected=id;$('graph').querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.module===id));inspect();}
function draw(){
 const svg=$('graph');svg.setAttribute('viewBox',`0 0 ${view.width} ${view.height}`);svg.style.aspectRatio=`${view.width}/${view.height}`;svg.style.width=$('zoom').value+'%';
 const defs='<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9aafb3" stroke-width="1.2"/></marker></defs>';
 const groups=(view.groups||[]).map(g=>`<rect x="${esc(g.x)}" y="${esc(g.y)}" width="${esc(g.width)}" height="${esc(g.height)}" rx="14" fill="#fafbf8" stroke="#dce5d1" stroke-dasharray="6 5"/>${text(g.x+17,g.y+25,g.label||'',11,'#91a181')}`).join('');
 const edges=(view.edges||[]).map(e=>`<path d="${esc(e.d)}" class="wire" stroke="${color(e.kind)[2]}" ${e.arrow===false?'':'marker-end="url(#arrow)"'}/>${e.label?text(e.labelX,e.labelY,e.label,11):''}`).join('');
 const nodes=view.nodes.map(n=>{const m=profile.modules[n.module],p=color(m.kind),expands=m.expandTo&&m.expandTo!==view.id;return `<g class="node ${selected===n.module?'selected':''}" data-node="${esc(n.id)}" data-module="${esc(n.module)}" role="button" tabindex="0" aria-label="${esc(m.title+' · '+(expands?'点击展开内部计算':'点击打开算子详情'))}"><title>${esc(m.title+' · '+(expands?'点击展开内部计算':'点击打开算子详情'))}</title><rect class="box" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="10" fill="${p[0]}" stroke="${p[1]}" stroke-width="1.2"/>${text(n.x+17,n.y+28,n.title||m.title,15,p[2],600)}${(n.lines||[]).map((line,i)=>text(n.x+17,n.y+54+i*21,line,12,'#738b93')).join('')}</g>`;}).join('');
 const notes=(view.notes||[]).map(n=>text(n.x,n.y,n.text,n.size||12)).join('');svg.innerHTML=defs+groups+edges+nodes+notes;
 svg.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>activate(n.dataset.module));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(n.dataset.module);}});});
 $('tabs').querySelectorAll('button').forEach(b=>{const active=b.dataset.view===view.id;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});
 $('current-view').textContent=(history.length?'内部计算 / ':'架构 / ')+(view.label||view.id);$('back').disabled=!history.length;
}
function navigate(id,push=true){const next=profile.views.find(v=>v.id===id);if(!next)return;if(push&&view&&view.id!==id)history.push(view.id);view=next;selected=view.nodes[0].module;draw();inspect();}
function activate(id){const m=profile.modules[id];select(id);if(m.expandTo&&m.expandTo!==view.id){navigate(m.expandTo);$('workspace').scrollIntoView({block:'start',behavior:'smooth'});report('已展开内部计算图，点击算子继续查看详情');}else showOperator(m);}
function showOperator(m){
 $('operator-title').textContent=m.title+' · 计算详情';
 $('operator-content').innerHTML=`<div class="tag">${esc(profile.label||profile.id)}</div><div class="operator-description">${mathHTML(m.description)}</div><div class="shapes"><div><div class="mini-label">输入 INPUT</div><div class="shape">${mathHTML(m.input)}</div></div><div><div class="mini-label">输出 OUTPUT</div><div class="shape">${mathHTML(m.output)}</div></div></div>${m.operations?.length?`<div class="mini-label">计算步骤</div><ol class="operations">${m.operations.map(s=>`<li>${mathHTML(s)}</li>`).join('')}</ol>`:''}<div class="mini-label">配置 / 层实例</div>${paramsHTML(m)}<div class="mini-label">对应源码</div>${sourceButton(m,'operator-source')}`;
 renderMath($('operator-content'));
 $('operator-source').onclick=()=>{$('operator-modal').close();showSource(m);};$('operator-modal').showModal();
}
function showSource(m){
 const file=sources.files?.[m.source.file];if(!file){report('未找到源码快照，请重新构建页面');return;}const range=rangeFor(m);
 $('source-title').textContent=sourceLabel(m);$('source-meta').textContent='工作区源码快照 · 原始行号 · 浅绿区域为对应定义';
 $('source-code').innerHTML=file.lines.map((line,i)=>`<span class="code-line ${i+1>=range[0]&&i+1<=range[1]?'focus':''}" data-line="${i+1}"><span class="line-number">${i+1}</span><span class="code-text">${esc(line)||' '}</span></span>`).join('');$('source-modal').showModal();
 requestAnimationFrame(()=>{const first=$('source-code').querySelector('.focus');if(first)$('source-code').scrollTop=Math.max(0,first.offsetTop-$('source-code').offsetTop-40);});
}
function setProfile(id){
 profile=spec.profiles.find(p=>p.id===id)||spec.profiles[0];history=[];
 $('tabs').innerHTML=profile.views.map(v=>`<button role="tab" data-view="${esc(v.id)}" aria-selected="false">${esc(v.label||v.id)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach((button,i,buttons)=>{button.onclick=()=>navigate(button.dataset.view);button.addEventListener('keydown',e=>{let index;if(e.key==='ArrowRight')index=(i+1)%buttons.length;else if(e.key==='ArrowLeft')index=(i+buttons.length-1)%buttons.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=buttons.length-1;else return;e.preventDefault();buttons[index].click();buttons[index].focus();});});
 $('assumptions').innerHTML=mathHTML(profile.assumptions||'形状由配置推导，未执行模型推理。');renderMath($('assumptions'));navigate(profile.defaultView||profile.views[0].id,false);
}
function exportSVG(){
 const svg=$('graph').cloneNode(true);svg.setAttribute('width',String(view.width));svg.setAttribute('height',String(view.height));svg.removeAttribute('style');
 const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='.wire{fill:none;stroke-width:1.5}.svg-text{font-family:Arial,"Microsoft YaHei",sans-serif}.node.selected .box{stroke:#587044;stroke-width:2}';svg.prepend(style);
 const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('width',String(view.width));bg.setAttribute('height',String(view.height));bg.setAttribute('fill','#fff');svg.insertBefore(bg,svg.children[1]);
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`architecture-${profile.id}-${view.id}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);report('已导出当前计算图 SVG');
}
function backdrop(dialog){dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});}
if(spec.profiles?.length){
 document.title=spec.title;$('page-title').textContent=spec.title;$('subtitle').innerHTML=mathHTML(spec.subtitle||'点击模块展开内部计算，继续点击算子查看形状与源码。');renderMath($('subtitle'));$('revision').textContent='页面版本 '+spec.revision;
 $('profile-picker').innerHTML=spec.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.label||p.id)}</option>`).join('');
 const initial=spec.defaultProfile||spec.profiles[0].id;$('profile-picker').value=initial;setProfile(initial);$('profile-picker').onchange=()=>setProfile($('profile-picker').value);
 $('back').onclick=()=>{const id=history.pop();if(id)navigate(id,false);};$('zoom').onchange=()=>draw();$('export').onclick=exportSVG;$('print').onclick=()=>window.print();
 $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('workspace').requestFullscreen)await $('workspace').requestFullscreen();else report('当前浏览器不支持全屏，可使用缩放控件');}catch{report('浏览器未允许全屏，可使用缩放控件');}};
 $('close-operator').onclick=()=>$('operator-modal').close();$('close-source').onclick=()=>$('source-modal').close();backdrop($('operator-modal'));backdrop($('source-modal'));
}
</script>
</body>
</html>
